<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Full Chain DNSSEC Debugger with ENS Verification</title>
    <link rel="stylesheet" href="./main.css"/>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1>Full Chain DNSSEC Debugger with ENS Verification</h1>
    <p>
      This tool validates the complete DNSSEC chain of trust from root to any
      domain, and checks for ENS-related DNS records.
    </p>

    <div class="form-group">
      <label for="domain">Domain Name:</label>
      <input
        type="text"
        id="domain"
        placeholder="example.com"
      />
    </div>

    <button id="validate-button" onclick="validateDNSSEC()">
      Validate DNSSEC Chain
    </button>

    <div id="debug-log" style="display: none"></div>

    <div id="loading" style="display: none" class="loading">
      <p>Validating DNSSEC chain of trust... This may take a moment</p>
    </div>

    <div id="result"></div>
    <script src="./main.js"></script>
  </body>
</html>
